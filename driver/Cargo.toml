[package]
edition = "2024"
name    = "vprog-tictactoe-driver"
publish = false
version = "0.1.0"

[lib]
name = "vprog_tictactoe_driver"
path = "src/lib.rs"

[[bin]]
name = "ttflow"
path = "src/main.rs"

[dependencies]
ctrlc                           = { version = "3", features = ["termination"] }
kaspa-addresses                 = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-consensus-core            = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-core                      = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-hashes                    = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-rpc-core                  = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-txscript                  = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-wrpc-client               = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
log                             = "0.4"
secp256k1                       = { version = "0.29.1", features = ["rand-std"] }
tokio                           = { version = "1", features = ["full"] }
vprog-tictactoe-guest           = { path = "../guest" }
vprogs-core-types               = { path = "../../vprogs/core/types" }
vprogs-l1-wallet                = { path = "../../vprogs/l1/wallet" }
vprogs-zk-abi                   = { path = "../../vprogs/zk/abi" }
vprogs-zk-backend-risc0-api     = { path = "../../vprogs/zk/backend/risc0/api" }
vprogs-zk-backend-risc0-app-kit = { path = "../../vprogs/zk/backend/risc0/app-kit" }

[dev-dependencies]
tempfile                           = "3"
vprogs-node-test-utils             = { path = "../../vprogs/node/test-utils" }
vprogs-runner                      = { path = "../../vprogs/runner" }
vprogs-zk-backend-risc0-test-suite = { path = "../../vprogs/zk/backend/risc0/test-suite" }
