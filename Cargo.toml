[workspace]
exclude  = ["guest"]
members  = ["driver", "encoder-wasm", "node"]
resolver = "3"

# Crate layout:
#   node/    - `ttd` daemon: vprogs runner driver + DA (frontend data) server
#   driver/  - `ttflow` scripted scenario driver + flow tests
#   guest/   - RISC0 guest crate, excluded above: own Cargo.lock and toolchain,
#              git-pins vprogs crates directly (no workspace inheritance).
#              Also serves as the shared wire library for host crates and the
#              web encoder.

  [workspace.dependencies]
  # kaspa L1 stack.
  kaspa-addresses      = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-core           = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-hashes         = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-rpc-core       = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-txscript       = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-wrpc-client    = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }

  # vprogs stack. The storage-write-drain branch (reorg-claim-exit plus the
  # write-worker shutdown drain, vprogs#147) carries the bridge live-lane join
  # fix, the reorg journal and revert hooks, app-kit, runtime-processor,
  # indexer hooks, and the exit index.
  vprogs-core-types                  = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-l1-types                    = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-l1-wallet                   = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-node-test-utils             = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-runner                      = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-scheduling-scheduler        = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-state-ptr-latest            = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-state-version               = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-storage-canonical-chain     = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-storage-rocksdb-store       = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-storage-types               = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-zk-abi                      = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-zk-backend-risc0-api        = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-zk-backend-risc0-app-kit    = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
  vprogs-zk-backend-risc0-test-suite = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }

  # Shared host deps.
  axum       = "0.8"
  borsh      = { version = "1", features = ["derive"] }
  ctrlc      = { version = "3", features = ["termination"] }
  faster-hex = "0.9"
  log        = "0.4"
  secp256k1  = { version = "0.29.1", features = ["rand-std"] }
  serde      = { version = "1", features = ["derive"] }
  serde_json = "1"
  tempfile   = "3"
  tokio      = { version = "1", features = ["full"] }
  tower      = { version = "0.5", features = ["util"] }
  tower-http = { version = "0.6", features = ["cors", "fs"] }

# The runtime-processor (own Cargo.lock, not a vprogs workspace member) pins its
# vprogs deps at biryukovmaxim/vprogs; redirect them to the same kaspanet branch so
# every vprogs crate in the graph resolves from a single source.
[patch."https://github.com/biryukovmaxim/vprogs"]
vprogs-core-codec                         = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
vprogs-core-hashing                       = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
vprogs-core-merkle-tree                   = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
vprogs-core-smt                           = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
vprogs-core-types                         = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
vprogs-l1-utils                           = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
vprogs-zk-abi                             = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
vprogs-zk-backend-risc0-api               = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
vprogs-zk-backend-risc0-runtime-processor = { git = "https://github.com/kaspanet/vprogs", branch = "storage-write-drain" }
