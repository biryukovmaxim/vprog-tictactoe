[workspace]
exclude  = ["guest"]
members  = ["driver", "node"]
resolver = "3"

# Crate layout:
#   node/    - `ttd` daemon: vprogs runner driver + DA (frontend data) server
#   driver/  - `ttflow` scripted scenario driver + flow tests
#   guest/   - RISC0 guest crate, excluded above: own Cargo.lock and toolchain,
#              git-pins vprogs crates directly (no workspace inheritance).
#              Also serves as the shared wire library for host crates and the
#              web encoder.

  [workspace.dependencies]
  # kaspa L1 stack.
  kaspa-addresses      = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-core           = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-hashes         = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-rpc-core       = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-txscript       = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
  kaspa-wrpc-client    = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }

  # vprogs stack. exit-index on the fork carries app-kit, runtime-processor,
  # indexer hooks, and exit index; flip to kaspanet/vprogs once the branches merge.
  vprogs-core-types                  = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-l1-types                    = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-l1-wallet                   = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-node-test-utils             = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-runner                      = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-scheduling-scheduler        = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-state-ptr-latest            = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-state-version               = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-storage-canonical-chain     = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-storage-rocksdb-store       = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-storage-types               = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-zk-abi                      = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-zk-backend-risc0-api        = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-zk-backend-risc0-app-kit    = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }
  vprogs-zk-backend-risc0-test-suite = { git = "https://github.com/biryukovmaxim/vprogs", branch = "exit-index" }

  # Shared host deps.
  axum       = "0.8"
  borsh      = { version = "1", features = ["derive"] }
  ctrlc      = { version = "3", features = ["termination"] }
  faster-hex = "0.9"
  log        = "0.4"
  secp256k1  = { version = "0.29.1", features = ["rand-std"] }
  serde      = { version = "1", features = ["derive"] }
  serde_json = "1"
  tempfile   = "3"
  tokio      = { version = "1", features = ["full"] }
  tower      = { version = "0.5", features = ["util"] }
  tower-http = { version = "0.6", features = ["cors", "fs"] }
