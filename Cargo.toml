[workspace]
exclude  = ["guest"]
members  = ["driver", "encoder-wasm", "node"]
resolver = "3"

# Crate layout:
#   node/    - `ttd` daemon: vprogs runner driver + DA (frontend data) server
#   driver/  - `ttflow` scripted scenario driver + flow tests
#   guest/   - RISC0 guest crate, excluded above: own Cargo.lock and toolchain,
#              git-pins vprogs crates directly (no workspace inheritance).
#              Also serves as the shared wire library for host crates and the
#              web encoder.

  [workspace.dependencies]
  # Kaspa L1 stack, rev-pinned to the same rusty-kaspa commit the vprogs branch below pins.
  kaspa-addresses           = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-consensus-core      = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-core                = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-grpc-client         = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-hashes              = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-pow                 = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-rpc-core            = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-testing-integration = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-txscript            = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-wrpc-client         = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspad                    = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }

  # vprogs stack, pinned to the PR-stack head (fix/g2-access-read-enforcement): Read-declaration enforcement
  # store restore and deferred dead lane proofs on top of settle-resume (write-
  # worker shutdown drain, fatal lane seeding, settlement-resume journal); the
  # bridge live-lane join fix, the reorg journal and revert hooks, app-kit,
  # runtime-processor, indexer hooks, and the exit index; the pp-finalization
  # window, canonical reads below the restore base, the restored read-only
  # state fix, the capped restored tip, and Read-declared write rejection.
  vprogs-core-types                  = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-l1-types                    = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-l1-wallet                   = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-node-test-utils             = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-runner                      = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-scheduling-scheduler        = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-state-ptr-latest            = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-state-version               = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-storage-canonical-chain     = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-storage-rocksdb-store       = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-storage-types               = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-zk-abi                      = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-zk-backend-risc0-api        = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-zk-backend-risc0-app-kit    = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
  vprogs-zk-backend-risc0-test-suite = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }

  # Shared host deps.
  axum       = "0.8"
  borsh      = { version = "1", features = ["derive"] }
  ctrlc      = { version = "3", features = ["termination"] }
  faster-hex = "0.9"
  log        = "0.4"
  secp256k1  = { version = "0.29.1", features = ["rand-std"] }
  serde      = { version = "1", features = ["derive"] }
  serde_json = "1"
  tempfile   = "3"
  tokio      = { version = "1", features = ["full"] }
  tower      = { version = "0.5", features = ["util"] }
  tower-http = { version = "0.6", features = ["cors", "fs"] }

  # Every vprogs crate in the graph (workspace members and the excluded guest
  # crate alike) pins the same kaspanet branch, so no fork patching is needed.
