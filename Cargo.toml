[workspace]
exclude  = ["guest"]
members  = ["driver", "encoder-wasm", "node"]
resolver = "3"

# Crate layout:
#   node/    - `ttd` daemon: vprogs runner driver + DA (frontend data) server
#   driver/  - `ttflow` scripted scenario driver + flow tests
#   guest/   - RISC0 guest crate, excluded above: own Cargo.lock and toolchain,
#              git-pins vprogs crates directly (no workspace inheritance).
#              Also serves as the shared wire library for host crates and the
#              web encoder.

  [workspace.dependencies]
  # Kaspa L1 stack, rev-pinned to the same rusty-kaspa commit the vprogs branch below pins.
  kaspa-addresses           = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-consensus-core      = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-core                = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-grpc-client         = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-hashes              = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-pow                 = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-rpc-core            = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-testing-integration = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-txscript            = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspa-wrpc-client         = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }
  kaspad                    = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "eb0a856d4e1ef9d884c5997bc43408091f5a5632" }

  # vprogs stack. The settle-resume branch (write-worker shutdown drain, fatal
  # lane seeding, and the settlement-resume journal) carries the bridge
  # live-lane join fix, the reorg journal and revert hooks, app-kit,
  # runtime-processor, indexer hooks, and the exit index.
  vprogs-core-types                  = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-l1-types                    = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-l1-wallet                   = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-node-test-utils             = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-runner                      = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-scheduling-scheduler        = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-state-ptr-latest            = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-state-version               = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-storage-canonical-chain     = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-storage-rocksdb-store       = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-storage-types               = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-zk-abi                      = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-zk-backend-risc0-api        = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-zk-backend-risc0-app-kit    = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
  vprogs-zk-backend-risc0-test-suite = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }

  # Shared host deps.
  axum       = "0.8"
  borsh      = { version = "1", features = ["derive"] }
  ctrlc      = { version = "3", features = ["termination"] }
  faster-hex = "0.9"
  log        = "0.4"
  secp256k1  = { version = "0.29.1", features = ["rand-std"] }
  serde      = { version = "1", features = ["derive"] }
  serde_json = "1"
  tempfile   = "3"
  tokio      = { version = "1", features = ["full"] }
  tower      = { version = "0.5", features = ["util"] }
  tower-http = { version = "0.6", features = ["cors", "fs"] }

# The runtime-processor (own Cargo.lock, not a vprogs workspace member) pins its
# vprogs deps at biryukovmaxim/vprogs; redirect them to the same kaspanet branch so
# every vprogs crate in the graph resolves from a single source.
[patch."https://github.com/biryukovmaxim/vprogs"]
vprogs-core-codec                         = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
vprogs-core-hashing                       = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
vprogs-core-merkle-tree                   = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
vprogs-core-smt                           = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
vprogs-core-types                         = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
vprogs-l1-utils                           = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
vprogs-zk-abi                             = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
vprogs-zk-backend-risc0-api               = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
vprogs-zk-backend-risc0-runtime-processor = { git = "https://github.com/kaspanet/vprogs", branch = "settle-resume" }
