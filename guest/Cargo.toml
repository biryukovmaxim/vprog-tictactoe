[package]
edition = "2024"
name    = "vprog-tictactoe-guest"
version = "0.1.0"

[lib]
name = "vprog_tictactoe_guest"
path = "src/lib.rs"

[[bin]]
doctest = false
name    = "vprog-tictactoe-guest"
path    = "src/main.rs"
test    = false

[dependencies]
hex-literal = "1.1.0"
risc0-zkvm  = { version = "3.0", default-features = false }
zerocopy    = { version = "0.8", default-features = false, features = ["derive"] }

# vprogs git pins, declared directly: this crate is excluded from the host
# workspace, so workspace inheritance is unavailable here. guest-hardening
# carries runtime-processor alongside the rest of the stack.
# Never vendored: only manifests reference vprogs.
vprogs-core-codec = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
vprogs-core-types = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement", default-features = false }
vprogs-l1-utils = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement" }
vprogs-zk-abi = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement", default-features = false }
vprogs-zk-backend-risc0-api = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement", default-features = false, features = [
  "guest",
] }
# The battery: runtime-processor's lib is consumed as the reusable guest machinery.
vprogs-zk-backend-risc0-runtime-processor = { git = "https://github.com/kaspanet/vprogs", branch = "fix/g2-access-read-enforcement", default-features = false }
