[package]
edition = "2024"
name    = "vprog-tictactoe-node"
publish = false
version = "0.1.0"

[[bin]]
name = "ttd"
path = "src/main.rs"

[features]
cuda = ["vprogs-runner/cuda"]

[dependencies]
ctrlc                       = { version = "3", features = ["termination"] }
kaspa-consensus-core        = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-core                  = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-hashes                = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
log                         = "0.4"
secp256k1                   = { version = "0.29.1", features = ["rand-std"] }
tokio                       = { version = "1", features = ["full"] }
vprogs-runner               = { path = "../../vprogs/runner" }
vprogs-zk-backend-risc0-api = { path = "../../vprogs/zk/backend/risc0/api" }
