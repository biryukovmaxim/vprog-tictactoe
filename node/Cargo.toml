[package]
edition = "2024"
name    = "vprog-tictactoe-node"
publish = false
version = "0.1.0"

[lib]
name = "vprog_tictactoe_node"
path = "src/lib.rs"

[[bin]]
name = "ttd"
path = "src/main.rs"

[features]
cuda = ["vprogs-runner/cuda"]

[dependencies]
ctrlc                          = { workspace = true }
kaspa-consensus-core           = { workspace = true }
kaspa-core                     = { workspace = true }
kaspa-hashes                   = { workspace = true }
log                            = { workspace = true }
secp256k1                      = { workspace = true }
tokio                          = { workspace = true }
vprog-tictactoe-guest          = { path = "../guest" }
vprogs-core-types              = { workspace = true }
vprogs-runner                  = { workspace = true }
vprogs-scheduling-scheduler    = { workspace = true }
vprogs-storage-canonical-chain = { workspace = true }
vprogs-storage-types           = { workspace = true }
vprogs-zk-backend-risc0-api    = { workspace = true }
zerocopy                       = { version = "0.8", default-features = false, features = ["derive"] }

[dev-dependencies]
tempfile                     = { workspace = true }
vprogs-core-types            = { workspace = true, features = ["test-utils"] }
vprogs-storage-rocksdb-store = { workspace = true }
